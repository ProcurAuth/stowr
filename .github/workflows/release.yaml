name: Release

# A tag vX.Y.Z (or vX.Y.Z-suffix) starts the release. The tag must be equal to the version of Cargo.toml, and
# CHANGELOG.md must have a section "## X.Y.Z (date)".
# The release has four files:
#   stowr_<version>_linux_amd64.tar.gz   the static binary `stowr` for Linux x86-64
#   stowr_<version>_linux_arm64.tar.gz   the static binary `stowr` for Linux AArch64
#   checksums.txt                        the SHA-256 of each archive (the format of sha256sum)
#   SHA256SUMS                           the same content as checksums.txt (the name of the other ProcurAuth releases)
# The notes of the release are the section of the version in CHANGELOG.md.
# The workflows CI (ci.yaml) and Nightly (nightly.yaml) run first: a release never ships a commit that fails the checks.
# No job builds an image for a registry, logs in to a registry or publishes an image.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# bash with -e and -o pipefail: a failure in a pipe stops the step.
defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Version, notes and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
      commit: ${{ steps.identity.outputs.commit }}
      date: ${{ steps.identity.outputs.date }}
      epoch: ${{ steps.identity.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Never publish container images
        run: |
          # The pattern is split so that this line does not match itself.
          if grep -rnE 'ghcr''\.io|docker/login''-action|docker pus''h\b|packages: *wr''ite|push: *tr''ue' .github/workflows; then
            echo "::error::workflows must not publish container images"
            exit 1
          fi
      - name: Identity of the build
        id: identity
        run: |
          tag="$GITHUB_REF_NAME"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::the tag $tag is not vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          version="${tag#v}"
          crate="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p;}' Cargo.toml | head -n 1)"
          if [ "$crate" != "$version" ]; then
            echo "::error::the tag $tag is not equal to the version $crate of Cargo.toml"
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          # The date of the commit, in UTC: two builds of one tag give the same binary and the same archives.
          date="$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ HEAD)"
          epoch="$(git show -s --format=%ct HEAD)"
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "commit=$commit"
            echo "date=$date"
            echo "epoch=$epoch"
          } >> "$GITHUB_OUTPUT"
      - name: Notes of the release
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          # The lines after the heading "## <version> (date)", up to the next heading of level 2.
          awk -v version="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " version " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section \"## $VERSION (date)\""
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error

  # The fast checks of a push to main (ci.yaml), then the heavy checks (nightly.yaml): clippy, the tests, the static
  # binary and the scratch image, the browser tests and the conformance test. Both workflows declare the trigger
  # workflow_call for this use. The release passes no secret to them. A release is rare, so it can wait for the heavy checks.
  checks:
    name: CI
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml

  heavy:
    name: Nightly checks
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/nightly.yaml

  binaries:
    name: Static binary (${{ matrix.arch }})
    needs: [prepare, checks, heavy]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, machine: "x86-64" }
          - { arch: arm64, runner: ubuntu-24.04-arm, machine: "ARM aarch64" }
    # The runner has the architecture of the binary: scripts/static.sh builds natively, in Docker.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      STOWR_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      STOWR_BUILD_COMMIT: ${{ needs.prepare.outputs.commit }}
      STOWR_BUILD_DATE: ${{ needs.prepare.outputs.date }}
      EPOCH: ${{ needs.prepare.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # scripts/static.sh reads STOWR_BUILD_VERSION, STOWR_BUILD_COMMIT and STOWR_BUILD_DATE and gives them to the
      # compiler. --check makes sure that the binary needs no dynamic loader, and runs `stowr version`.
      - name: Build the static binary
        run: |
          scripts/static.sh --check | tee "$RUNNER_TEMP/version.txt"
          grep -Fx "stowr ${VERSION} · ${STOWR_BUILD_COMMIT:0:9}" "$RUNNER_TEMP/version.txt"
          mkdir -p dist/bin
          scripts/static.sh --copy dist/bin
      - name: Check the binary
        run: |
          description="$(file -b dist/bin/stowr)"
          echo "$description"
          case "$description" in *"${{ matrix.machine }}"*) ;; *) echo "::error::stowr is not a ${{ matrix.machine }} binary"; exit 1 ;; esac
          case "$description" in *"statically linked"* | *"static-pie linked"*) ;; *) echo "::error::stowr is not static"; exit 1 ;; esac
          dist/bin/stowr version
      # The archive has one file at its root: stowr, mode 0755, owner 0:0, with the date of the commit.
      - name: Pack the archive
        run: |
          name="stowr_${VERSION}_linux_${{ matrix.arch }}.tar.gz"
          stage="$(mktemp -d)"
          install -m 0755 dist/bin/stowr "$stage/stowr"
          tar -C "$stage" --owner=0 --group=0 --numeric-owner --mtime="@${EPOCH}" -cf - stowr | gzip -9n > "dist/$name"
          rm -rf "$stage"
          tar -tvzf "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.arch }}
          path: dist/stowr_${{ needs.prepare.outputs.version }}_linux_${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [prepare, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes
      - name: Checksums
        run: |
          cd dist
          sha256sum "stowr_${VERSION}_linux_amd64.tar.gz" "stowr_${VERSION}_linux_arm64.tar.gz" > checksums.txt
          # The other ProcurAuth releases use the name SHA256SUMS. Stowr keeps checksums.txt for the current users.
          cp checksums.txt SHA256SUMS
          sha256sum --check SHA256SUMS
          cat checksums.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          options=()
          if [ "$PRERELEASE" = true ]; then options=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file notes/notes.md "${options[@]}" \
            "dist/stowr_${VERSION}_linux_amd64.tar.gz" "dist/stowr_${VERSION}_linux_arm64.tar.gz" dist/checksums.txt \
            dist/SHA256SUMS
