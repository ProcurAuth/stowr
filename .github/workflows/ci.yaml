name: CI

# This workflow is the fast path of a push and of a pull request. A job takes a few seconds to a few tens of seconds.
# It has no Docker image build and no full Rust compile. The heavy checks (clippy, the tests, the static binary and the
# scratch image, the browser tests, the conformance test) are in nightly.yaml. They also run before a release, and by hand
# (workflow_dispatch on a branch). The same checks run on a developer machine: scripts/heavy.sh (docs/DEVELOPMENT.md).
# No job logs in to a registry or pushes an image.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  # The release workflow calls this workflow as a gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# bash with -e and -o pipefail: a failure in a pipe stops the step.
defaults:
  run:
    shell: bash

jobs:
  policy:
    name: Policy (no image is published)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Never publish container images
        run: |
          # The pattern is split so that this line does not match itself.
          if grep -rnE 'ghcr''\.io|docker/login''-action|docker pus''h\b|packages: *wr''ite|push: *tr''ue' .github/workflows; then
            echo "::error::workflows must not publish container images"
            exit 1
          fi

  fast:
    name: Format, rules of the runtime and shell syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml is the only place of the version. Only rustfmt runs here: it reads the source and needs no
      # dependency, so the job makes no build. The runner has rustup. The cache holds the toolchain, so a run does not
      # download it again.
      - name: Version of the Rust toolchain
        id: rust
        run: |
          version="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          if [ -z "$version" ]; then
            echo "::error::rust-toolchain.toml has no channel"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache the Rust toolchain
        id: toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.rust.outputs.version }}-*
            ~/.rustup/update-hashes/${{ steps.rust.outputs.version }}-*
          key: rustup-${{ runner.os }}-${{ steps.rust.outputs.version }}-rustfmt-v1
      - name: Install the Rust toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        env:
          RUST_VERSION: ${{ steps.rust.outputs.version }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --no-self-update
      - name: Format
        env:
          RUST_VERSION: ${{ steps.rust.outputs.version }}
        run: cargo "+$RUST_VERSION" fmt --all -- --check
      - name: Rules of the runtime
        run: scripts/check-invariants.sh
      - name: Shell syntax of the scripts
        run: |
          status=0
          for file in scripts/*.sh test/*.sh test/*/*.sh test/*/scripts/*.sh; do
            [ -e "$file" ] || continue
            bash -n "$file" || status=1
          done
          exit "$status"
