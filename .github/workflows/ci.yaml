name: CI

# Each job runs the scripts of the repository (docs/DEVELOPMENT.md). The scripts run cargo in the pinned Rust image, in
# Docker: the runner needs Docker only. No job logs in to a registry or pushes an image.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# bash with -e and -o pipefail: a failure in a pipe stops the step.
defaults:
  run:
    shell: bash

jobs:
  policy:
    name: Policy (no image is published)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Never publish container images
        run: |
          # The pattern is split so that this line does not match itself.
          if grep -rnE 'ghcr''\.io|docker/login''-action|docker push''\b|packages: *wr''ite|push: *tr''ue' .github/workflows; then
            echo "::error::workflows must not publish container images"
            exit 1
          fi

  rust:
    name: Format, clippy, tests and rules of the runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Format
        run: scripts/cargo.sh fmt --all -- --check
      - name: Clippy
        run: scripts/cargo.sh clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: scripts/cargo.sh test --locked
      - name: Rules of the runtime
        run: scripts/check-invariants.sh
      - name: Shell syntax of the scripts
        run: |
          for file in scripts/*.sh test/*.sh test/*/*.sh test/*/scripts/*.sh; do
            [ -e "$file" ] || continue
            bash -n "$file"
          done

  static:
    name: Static binary and scratch image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # scripts/static.sh --check builds the static binary for the architecture of the runner, makes sure that it needs
      # no dynamic loader, and runs `stowr version`.
      - name: Static binary
        env:
          STOWR_BUILD_VERSION: ci
          STOWR_BUILD_COMMIT: ${{ github.sha }}
        run: |
          scripts/static.sh --check | tee "$RUNNER_TEMP/version.txt"
          grep -F "ci · ${GITHUB_SHA:0:9}" "$RUNNER_TEMP/version.txt"
      - name: Scratch image
        env:
          BUILD_VERSION: ci
          BUILD_COMMIT: ${{ github.sha }}
        run: ./test/scratch-runtime.sh

  frontend:
    name: Browser tests of the interface
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Browser tests
        run: ./test/frontend/run.sh
